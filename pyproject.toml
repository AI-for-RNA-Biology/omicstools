[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "omicstools"
version = "0.2.0"
description = "Generic tools for omics data analysis (dataset handling, linear mixed models, GMM thresholds, plotting)"
authors = ["Lisa Fournier <lisa.fournier@unibe.ch>"]
readme = "README.md"
repository = "https://github.com/AI-for-RNA-Biology/omicstools"
license = "GPL-3.0-only"
packages = [{include = "omicstools"}] # editable mode

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.23.4"
pandas = "^1.5.1"
scipy = "^1.11.2"
matplotlib = "^3.8.0"
seaborn = "^0.11.2"
statannotations = "^0.5.0"
rpy2 = "^3.5.10"
graspologic = {version = "*", optional = true}
scanalysis = {git = "https://github.com/AI-for-RNA-Biology/scanalysis.git"}

[tool.poetry.extras]
gmm = ["graspologic"]

[tool.poetry.group.dev.dependencies]
bandit = "^1.7.4"
black = "^22.10.0"
coverage = "^6.5.0"
flake8 = "^5.0.4"
pre-commit = "^2.20.0"
pytest = "^7.2.0"
pytest-mock = "^3.10.0"
